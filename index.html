    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; touch-action: manipulation; }
        
        body { 
            margin: 0; padding: 0; background: #000; color: #fff; 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            display: flex; flex-direction: column; 
            user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none; 
        }
        
        #overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 100; display: none; opacity: 0; transition: opacity 0.3s; }
        #side-menu { position: fixed; top: 0; left: -280px; bottom: 0; width: 280px; background: #111; z-index: 101; transition: left 0.3s ease; display: flex; flex-direction: column; padding-top: calc(env(safe-area-inset-top) + 20px); box-shadow: 5px 0 20px rgba(0,0,0,0.5); }
        
        .menu-item { padding: 20px 25px; font-size: 24px; font-weight: bold; border-bottom: 1px solid #222; cursor: pointer; color: #aaa; }
        .menu-item.active { color: #fff; background: #222; border-left: 5px solid #007AFF; }
        .menu-item:active { background: #333; }

        #menu-btn { position: absolute; top: calc(env(safe-area-inset-top) + 10px); left: 15px; z-index: 99; background: rgba(255,255,255,0.15); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; }
        #menu-btn:active { transform: scale(0.9); }

        .tab-view { flex: 1; display: none; flex-direction: column; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); overflow: hidden; }
        .tab-view.active { display: flex; }

        /* ==================== КОМПАКТНАЯ КЛАВИАТУРА ==================== */
        .keyboard { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; /* Уменьшен зазор */
            justify-items: center; 
            align-self: center; 
            width: 100%; 
            max-width: 260px; 
            flex-shrink: 0; /* Гарантия, что не сожмется и не исчезнет */
            margin-bottom: 10px; 
        }
        
        .key { 
            background: #333; color: #fff; border: none; 
            width: 60px; height: 60px; /* Кнопки стали меньше (были 75) */
            border-radius: 30px; 
            font-size: 24px; /* Шрифт чуть меньше */
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
        }
        .key:active { background: #666; transform: scale(0.9); }
        .key-c { color: #FF453A; background: #2a0000; font-weight: bold; }
        .key-ok { background: #32D74B; color: #000; font-weight: bold; }
        .key-ok:active { background: #28a745; }

        /* ==================== ВКЛАДКА 1: ГЛАВНАЯ ==================== */
        #top-zone { flex: 0 0 28%; display: flex; padding: 15px 20px 15px 70px; box-sizing: border-box; }
        #roll-btn { flex: 1; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.1s; box-shadow: 0 10px 30px -10px rgba(255,255,255,0.2); }
        #roll-btn:active { transform: scale(0.95); }

        .r2 { background: linear-gradient(135deg, #BF5AF2, #782FCD); }
