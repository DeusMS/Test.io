<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Тандем-Пост</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background-color: #000000; 
            color: #FFFFFF; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            height: 100dvh; 
            overflow: hidden; 
            user-select: none; 
            -webkit-user-select: none; 
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        /* === ВЕРХНЯЯ ЗОНА === */
        #top-container {
            height: 35vh; 
            min-height: 250px;
            padding: 16px 20px;
            display: flex;
            align-items: stretch;
            flex-shrink: 0; 
        }

        #roll-zone { 
            flex: 1;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            border-radius: 40px; 
            transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        #roll-zone.pressing { transform: scale(0.92); }
        
        #roll-number { 
            font-size: 130px; 
            font-weight: 600; 
            letter-spacing: -4px;
            pointer-events: none; 
            color: #FFFFFF;
            text-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        #roll-label { 
            font-size: 16px; 
            font-weight: 600;
            color: rgba(255,255,255,0.8); 
            pointer-events: none;
            margin-top: -10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .theme-1 { background: linear-gradient(135deg, #007AFF, #0050B3); box-shadow: 0 10px 40px -10px rgba(0, 122, 255, 0.6); }
        .theme-2 { background: linear-gradient(135deg, #BF5AF2, #782FCD); box-shadow: 0 10px 40px -10px rgba(191, 90, 242, 0.6); }
        .theme-3 { background: linear-gradient(135deg, #FF9F0A, #CC7300); box-shadow: 0 10px 40px -10px rgba(255, 159, 10, 0.6); }
        .theme-4 { background: linear-gradient(135deg, #FF453A, #B31009); box-shadow: 0 10px 50px -5px rgba(255, 69, 58, 0.8); }

        .pulse-alert { animation: pulseBg 1s infinite alternate; }
        @keyframes pulseBg {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(0.97); filter: brightness(1.2); }
        }

        /* === НИЖНЯЯ ЗОНА === */
        #bottom-zone { 
            flex: 1 1 0%; /* Исправлено для Apple Safari, чтобы блок не схлопывался */
            display: flex; 
            flex-direction: column; 
            padding: 0 24px 20px 24px;
            overflow: hidden; 
        }
        
        /* Лента памяти */
        #history-list { 
            flex: 1 1 0%; 
            overflow-y: auto; 
            margin-bottom: 12px; 
            display: flex;
            flex-direction: column;
            gap: 12px;
            
            /* Скрываем ползунок скролла */
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        #history-list::-webkit-scrollbar { display: none; }
        
        .history-item { 
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 20px; 
            border-radius: 24px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0; 
        }
        
        .history-value { font-size: 24px; font-weight: 500; color: #FFFFFF; }
        
        .delete-btn { 
            background: rgba(255, 69, 58, 0.2); 
            color: #FF453A; 
            border: none; 
            width: 44px; height: 44px; border-radius: 22px; 
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: background 0.2s, transform 0.2s;
        }
        .delete-btn:active { background: rgba(255, 69, 58, 0.4); transform: scale(0.9); }
        
        /* Дисплей ввода */
        #display { 
            font-size: 56px; 
            font-weight: 300; 
            text-align: right; 
            margin-bottom: 16px; 
            color: #FFFFFF; 
            min-height: 66px; 
            flex-shrink: 0; 
        }
        
        /* Клавиатура */
        #numpad { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 1
