<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <title>Тандем-Пост</title>

    <meta name="apple-mobile-web-app-title" content="Стан">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; touch-action: manipulation; }
        
        body { 
            margin: 0; padding: 0; background: #000; color: #fff; 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            display: flex; flex-direction: column; 
            user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none; 
        }
        
        #overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 100; display: none; opacity: 0; transition: opacity 0.3s; }
        #side-menu { position: fixed; top: 0; left: -280px; bottom: 0; width: 280px; background: #111; z-index: 101; transition: left 0.3s ease; display: flex; flex-direction: column; padding-top: calc(env(safe-area-inset-top) + 20px); box-shadow: 5px 0 20px rgba(0,0,0,0.5); }
        
        .menu-item { padding: 20px 25px; font-size: 24px; font-weight: bold; border-bottom: 1px solid #222; cursor: pointer; color: #aaa; }
        .menu-item.active { color: #fff; background: #222; border-left: 5px solid #007AFF; }
        .menu-item:active { background: #333; }

        #menu-btn { position: absolute; top: calc(env(safe-area-inset-top) + 10px); left: 15px; z-index: 99; background: rgba(255,255,255,0.15); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; }
        #menu-btn:active { transform: scale(0.9); }

        .tab-view { flex: 1; display: none; flex-direction: column; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); overflow: hidden; }
        .tab-view.active { display: flex; }

        /* ==================== КОМПАКТНАЯ КЛАВИАТУРА ==================== */
        .keyboard { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; justify-items: center; align-self: center; 
            width: 100%; max-width: 260px; flex-shrink: 0; margin-bottom: 10px; 
        }
        
        .key { 
            background: #333; color: #fff; border: none; 
            width: 60px; height: 60px; border-radius: 30px; 
            font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; 
        }
        .key:active { background: #666; transform: scale(0.9); }
        .key-c { color: #FF453A; background: #2a0000; font-weight: bold; }
        .key-ok { background: #32D74B; color: #000; font-weight: bold; }
        .key-ok:active { background: #28a745; }

        /* ==================== ВКЛАДКА 1: ГЛАВНАЯ ==================== */
        #top-zone { flex: 0 0 28%; display: flex; padding: 15px 20px 15px 70px; box-sizing: border-box; }
        #roll-btn { flex: 1; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.1s; box-shadow: 0 10px 30px -10px rgba(255,255,255,0.2); }
        #roll-btn:active { transform: scale(0.95); }
        
        .r1 { background: linear-gradient(135deg, #007AFF, #0050B3); }
        .r2 { background: linear-gradient(135deg, #BF5AF2, #782FCD); }
        .r3 { background: linear-gradient(135deg, #FF9F0A, #CC7300); }
        .r4 { background: linear-gradient(135deg, #FF453A, #B31009); box-shadow: 0 0 40px rgba(255, 69, 58, 0.6) !important; }
        
        #bot-zone { flex: 1; display: flex; flex-direction: column; padding: 0 15px 15px 15px; box-sizing: border-box; overflow: hidden; }
        #history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; min-height: 80px; -ms-overflow-style: none; scrollbar-width: none; overscroll-behavior: contain; }
        #history::-webkit-scrollbar { display: none; }
        .itm { background: #222; padding: 10px 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: bold; border: 1px solid #333; }
        .del-btn { background: #4a0000; color: #ff4444; border: none; border-radius: 50%; width: 35px; height: 35px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .del-btn:active { background: #ff4444; color: #fff; }
        #display { font-size: 40px; text-align: right; color: #fff; min-height: 48px; margin-bottom: 10px; font-weight: 300; padding-right: 15px; letter-spacing: 2px; }

        /* ==================== ВКЛАДКА 2: МОТАЛКИ ==================== */
        #tab-coilers { padding: 50px 20px 20px 20px; }
        .page-title { font-size: 28px; font-weight: bold; margin-bottom: 20px; margin-left: 10px; }
        .setting-row { background: #1C1C1E; border-radius: 16px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .setting-label { font-size: 20px; font-weight: 600; }

        .stepper { display: flex; align-items: center; background: #000; border-radius: 12px; padding: 4px; }
        .step-btn { background: #333; border: none; color: #fff; font-size: 26px; font-weight: bold; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .step-btn:active { background: #555; transform: scale(0.9); }
        .step-val { width: 50px; text-align: center; font-size: 22px; font-weight: bold; color: #007AFF; }

        .toggle-switch { width: 60px; height: 34px; background: #333; border-radius: 17px; position: relative; cursor: pointer; transition: background 0.3s; }
        .toggle-switch .knob { width: 28px; height: 28px; background: #fff; border-radius: 50%; position: absolute; top: 3px; left: 3px; transition: left 0.3s, transform 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .toggle-switch.on { background: #32D74B; }
        .toggle-switch.on .knob { left: 29px; }

        /* ==================== ВКЛАДКА 3: ПРОБЕГИ ==================== */
        #tab-mileage { padding: 50px 15px 15px 15px; display: none; flex-direction: column; }
        #tab-mileage.active { display: flex; }
        
        #stands-container { 
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            margin-bottom: 10px; 
            -ms-overflow-style: none; scrollbar-width: none;
        }
        #stands-container::-webkit-scrollbar { display: none; }
        
        .stand-row { 
            background: #1C1C1E; 
            padding: 8px 12px; 
            border-radius: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
            border: 1px solid transparent; 
            flex-shrink: 0;
        }
        
        .s-name { font-size: 18px; font-weight: bold; color: #aaa; width: 70px; }
        .s-calc { font-size: 20px; font-weight: bold; color: #32D74B; flex: 1; text-align: right; padding-right: 25px; letter-spacing: 1px; }
        
        .s-inp { 
            background: #000; border: 2px solid #333; color: #fff; 
            font-size: 19px; font-weight: bold; min-width: 95px; 
            text-align: center; padding: 6px 4px; border-radius: 10px; 
            cursor: pointer; transition: 0.2s; letter-spacing: 1px; 
        }
        
        .stand-row.active { border-color: #007AFF; background: #002244; }
        .stand-row.active .s-inp { border-color: #007AFF; background: #0050B3; }
        .stand-row.active .s-name { color: #fff; }

        /* ==================== ВКЛАДКА 4: СОБЫТИЯ ==================== */
        #tab-events { padding: 50px 15px 15px 15px; display: none; flex-direction: column; overflow: hidden; }
        #tab-events.active { display: flex; }

        .event-btn { 
            background: #1C1C1E; color: #fff; border: 2px solid #333; 
            padding: 14px 10px; border-radius: 14px; font-size: 20px; font-weight: bold;
            cursor: pointer; transition: 0.1s; display: flex; justify-content: center; align-items: center;
        }
        .event-btn:active { background: #333; border-color: #007AFF; transform: scale(0.95); }
        
        #events-list { 
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; 
            gap: 8px; -ms-overflow-style: none; scrollbar-width: none; padding-top: 5px;
            overscroll-behavior: contain;
        }
        #events-list::-webkit-scrollbar { display: none; }
        
        .event-itm { 
            background: #222; padding: 12px 16px; border-radius: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
            font-size: 20px; font-weight: bold; border: 1px solid #333; flex-shrink: 0; 
        }
        .event-time { color: #007AFF; font-size: 18px; font-weight: 600; }
        
        .clear-btn {
            background: rgba(255, 69, 58, 0.15); color: #FF453A; border: none; 
            padding: 6px 14px; border-radius: 10px; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: 0.1s;
        }
        .clear-btn:active { background: rgba(255, 69, 58, 0.3); transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="menu-btn" onclick="toggleMenu()">☰</div>
    <div id="overlay" onclick="toggleMenu()"></div>

    <div id="side-menu">
        <div class="menu-item active" id="nav-main" onclick="switchTab('main')">Главная</div>
        <div class="menu-item" id="nav-coilers" onclick="switchTab('coilers')">Моталки</div>
        <div class="menu-item" id="nav-mileage" onclick="switchTab('mileage')">Расчет пробегов</div>
        <div class="menu-item" id="nav-events" onclick="switchTab('events')">Отметки</div>
    </div>

    <!-- ВКЛАДКА 1 -->
    <div id="tab-main" class="tab-view active">
        <div id="top-zone">
            <div id="roll-btn" class="r1">
                <div id="roll-num" style="font-size:90px; font-weight:bold; text-shadow: 0 4px 10px rgba(0,0,0,0.3);">1</div>
                <div id="roll-lbl" style="font-size:16px; font-weight:bold; color: rgba(255,255,255,0.8);">РУЛОН</div>
            </div>
        </div>
        <div id="bot-zone">
            <div id="history"></div>
            <div id="display">_</div>
            <div class="keyboard">
                <button class="key" onclick="k('1')">1</button><button class="key" onclick="k('2')">2</button><button class="key" onclick="k('3')">3</button>
                <button class="key" onclick="k('4')">4</button><button class="key" onclick="k('5')">5</button><button class="key" onclick="k('6')">6</button>
                <button class="key" onclick="k('7')">7</button><button class="key" onclick="k('8')">8</button><button class="key" onclick="k('9')">9</button>
                <button class="key key-c" onclick="k('C')">C</button><button class="key" onclick="k('0')">0</button><button class="key key-ok" onclick="k('OK')">OK</button>
            </div>
        </div>
    </div>

    <!-- ВКЛАДКА 2 -->
    <div id="tab-coilers" class="tab-view">
        <div class="page-title">Моталки</div>
        <div class="setting-row">
            <div class="setting-label">Высечки</div>
            <div class="stepper">
                <button class="step-btn" onclick="changeCut(-5)">-</button>
                <div class="step-val" id="cut-val">5</div>
                <button class="step-btn" onclick="changeCut(5)">+</button>
            </div>
        </div>
        <div class="setting-row" onclick="toggleThick()">
            <div class="setting-label">Утолщенный</div>
            <div class="toggle-switch" id="thick-toggle">
                <div class="knob"></div>
            </div>
        </div>
    </div>

    <!-- ВКЛАДКА 3: ПРОБЕГИ -->
    <div id="tab-mileage" class="tab-view">
        <div class="page-title" style="margin-bottom: 10px;">Расчет пробегов</div>
        
        <div id="stands-container">
            <div class="stand-row active" id="row-5" onclick="actMil(5)">
                <div class="s-name">5 клеть</div>
                <div class="s-calc" id="mc-5">0 м</div>
                <div class="s-inp" id="mi-5">_</div>
            </div>
            <div class="stand-row" id="row-4" onclick="actMil(4)">
                <div class="s-name">4 клеть</div>
                <div class="s-calc" id="mc-4">0 м</div>
                <div class="s-inp" id="mi-4">-</div>
            </div>
            <div class="stand-row" id="row-3" onclick="actMil(3)">
                <div class="s-name">3 клеть</div>
                <div class="s-calc" id="mc-3">0 м</div>
                <div class="s-inp" id="mi-3">-</div>
            </div>
            <div class="stand-row" id="row-2" onclick="actMil(2)">
                <div class="s-name">2 клеть</div>
                <div class="s-calc" id="mc-2">0 м</div>
                <div class="s-inp" id="mi-2">-</div>
            </div>
            <div class="stand-row" id="row-1" onclick="actMil(1)">
                <div class="s-name">1 клеть</div>
                <div class="s-calc" id="mc-1">0 м</div>
                <div class="s-inp" id="mi-1">-</div>
            </div>
        </div>

        <div class="keyboard">
            <button class="key" onclick="kMil('1')">1</button><button class="key" onclick="kMil('2')">2</button><button class="key" onclick="kMil('3')">3</button>
            <button class="key" onclick="kMil('4')">4</button><button class="key" onclick="kMil('5')">5</button><button class="key" onclick="kMil('6')">6</button>
            <button class="key" onclick="kMil('7')">7</button><button class="key" onclick="kMil('8')">8</button><button class="key" onclick="kMil('9')">9</button>
            <button class="key key-c" onclick="kMil('C')">C</button><button class="key" onclick="kMil('0')">0</button><button class="key key-ok" onclick="kMil('OK')">OK</button>
        </div>
    </div>

    <!-- ВКЛАДКА 4: СОБЫТИЯ -->
    <div id="tab-events" class="tab-view">
        <div class="page-title" style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 28px; font-weight: bold; margin-left: 10px;">События</span>
            <button class="clear-btn" onclick="clearEvents()">Очистить</button>
        </div>
        
        <!-- Кнопки событий -->
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px;">
            <button class="event-btn" onclick="addEvent('Брак')">Брак</button>
            <button class="event-btn" onclick="addEvent('Пробный')">Пробный</button>
            <button class="event-btn" onclick="addEvent('Разворот')">Разворот</button>
            <button class="event-btn" onclick="addEvent('Серп')">Серп</button>
            <button class="event-btn" onclick="addEvent('Узкий')" style="grid-column: span 2;">Узкий</button>
        </div>

        <!-- Лента событий -->
        <div id="events-list"></div>
    </div>

    <script>
        // Анти-зум
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
        var lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            var now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) { e.preventDefault(); }
            lastTouchEnd = now;
        }, { passive: false });
        
        // Разрешаем скролл для истории, пробегов и списка событий
        document.addEventListener('touchmove', function(e) {
            if (!e.target.closest('#history') && !e.target.closest('#stands-container') && !e.target.closest('#events-list')) { e.preventDefault(); }
        }, { passive: false });

        // Меню
        var menuOpen = false;
        function toggleMenu() {
            var menu = document.getElementById('side-menu');
            var overlay = document.getElementById('overlay');
            if(menuOpen) {
                menu.style.left = "-280px"; overlay.style.opacity = "0";
                setTimeout(function(){ overlay.style.display = "none"; }, 300);
            } else {
                overlay.style.display = "block";
                setTimeout(function(){ overlay.style.opacity = "1"; menu.style.left = "0"; }, 10);
            }
            menuOpen = !menuOpen;
        }

        function switchTab(tabName) {
            document.getElementById('tab-main').classList.remove('active');
            document.getElementById('tab-coilers').classList.remove('active');
            document.getElementById('tab-mileage').classList.remove('active');
            document.getElementById('tab-events').classList.remove('active');
            
            document.getElementById('nav-main').classList.remove('active');
            document.getElementById('nav-coilers').classList.remove('active');
            document.getElementById('nav-mileage').classList.remove('active');
            document.getElementById('nav-events').classList.remove('active');
            
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('nav-' + tabName).classList.add('active');
            toggleMenu(); 
        }

        // Память
        var cRoll = 1, hist = [], inp = "", vCut = 5, vThick = false, pressTimer, isLongPress = false;
        var eventsLog = [];

        function saveAll() { 
            try { 
                localStorage.setItem('r_val', cRoll); 
                localStorage.setItem('h_val', JSON.stringify(hist)); 
                localStorage.setItem('cut_val', vCut); 
                localStorage.setItem('thick_val', vThick); 
                localStorage.setItem('e_val', JSON.stringify(eventsLog)); 
            } catch(e) {} 
        }

        function loadAll() { 
            try { 
                cRoll = parseInt(localStorage.getItem('r_val')) || 1; 
                hist = JSON.parse(localStorage.getItem('h_val')) || []; 
                vCut = parseInt(localStorage.getItem('cut_val')) || 5; 
                vThick = localStorage.getItem('thick_val') === 'true'; 
                eventsLog = JSON.parse(localStorage.getItem('e_val')) || [];
            } catch(e) { 
                cRoll = 1; hist = []; vCut = 5; vThick = false; eventsLog = []; localStorage.clear(); 
            } 
        }
        loadAll(); 

        // Вкладка События
        window.addEvent = function(name) {
            wake();
            var now = new Date();
            var hours = now.getHours().toString().padStart(2, '0');
            var minutes = now.getMinutes().toString().padStart(2, '0');
            var seconds = now.getSeconds().toString().padStart(2, '0');
            
            eventsLog.push({ name: name, time: hours + ':' + minutes + ':' + seconds });
            saveAll();
            renderEvents();
        }

        window.clearEvents = function() {
            wake();
            eventsLog = [];
            saveAll();
            renderEvents();
        }

        function renderEvents() {
            var el = document.getElementById('events-list');
            el.innerHTML = "";
            for(var i = 0; i < eventsLog.length; i++) { 
                el.innerHTML += "<div class='event-itm'><span>" + eventsLog[i].name + "</span><span class='event-time'>" + eventsLog[i].time + "</span></div>"; 
            }
            el.scrollTop = el.scrollHeight; 
        }

        // Вкладка Пробеги
        var actStand = 5;
        var mInp = "";
        var K = { 5: 1.000, 4: 0.970, 3: 0.679, 2: 0.475, 1: 0.295 };

        window.actMil = function(stand) { wake(); actStand = stand; mInp = ""; renderMil(); }
        window.kMil = function(val) { wake(); if(val === 'C') { mInp = ""; } else if(val !== 'OK') { if(mInp.length < 6) mInp += val; } renderMil(); }

        function renderMil() {
            var val = parseFloat(mInp);
            if(isNaN(val)) val = 0;
            var L5 = val / K[actStand];
            
            for(var i = 1; i <= 5; i++) {
                var calcVal = L5 * K[i];
                document.getElementById('mc-' + i).innerText = calcVal.toFixed(0) + " м";
                
                var rowEl = document.getElementById('row-' + i);
                var inpEl = document.getElementById('mi-' + i);
                
                if(i === actStand) {
                    rowEl.classList.add('active');
                    inpEl.innerText = mInp === "" ? "_" : mInp;
                } else {
                    rowEl.classList.remove('active');
                    inpEl.innerText = "-";
                }
            }
        }

        // Вкладка Моталки
        function renderCoilers() { document.getElementById('cut-val').innerText = vCut; var tgl = document.getElementById('thick-toggle'); if(vThick) tgl.classList.add('on'); else tgl.classList.remove('on'); }
        window.changeCut = function(delta) { wake(); var next = vCut + delta; if(next >= 5 && next <= 60) { vCut = next; saveAll(); renderCoilers(); } }
        window.toggleThick = function() { wake(); vThick = !vThick; saveAll(); renderCoilers(); }

        // Вкладка Главная
        function renderMain() {
            document.getElementById('roll-num').innerText = cRoll;
            document.getElementById('roll-lbl').innerText = cRoll === 4 ? "ИНСПЕКЦИЯ" : "РУЛОН";
            document.getElementById('roll-btn').className = "r" + cRoll;
            document.getElementById('display').innerText = inp === "" ? "_" : inp;

            var hDiv = document.getElementById('history');
            hDiv.innerHTML = "";
            for(var i = 0; i < hist.length; i++) { hDiv.innerHTML += "<div class='itm'><span>" + hist[i] + " м</span><button class='del-btn' onclick='del(" + i + ")'>✖</button></div>"; }
            hDiv.scrollTop = hDiv.scrollHeight; 
        }

        window.del = function(index) { hist.splice(index, 1); saveAll(); renderMain(); wake(); };
        window.k = function(val) { wake(); if(val === 'C') inp = ""; else if(val === 'OK') { if(inp !== "") { hist.push(inp); inp = ""; saveAll(); } } else { if(inp.length < 6) inp += val; } renderMain(); };

        var btn = document.getElementById('roll-btn');
        function startPress(e) { if(e.type === 'touchstart') e.preventDefault(); wake(); isLongPress = false; pressTimer = setTimeout(function() { isLongPress = true; cRoll = 1; saveAll(); renderMain(); }, 1000); }
        function endPress(e) { if(e.type === 'touchend') e.preventDefault(); clearTimeout(pressTimer); if(!isLongPress) { cRoll = cRoll < 4 ? cRoll + 1 : 1; saveAll(); renderMain(); } }

        btn.addEventListener('mousedown', startPress);
        btn.addEventListener('touchstart', startPress, {passive: false});
        btn.addEventListener('mouseup', endPress);
        btn.addEventListener('touchend', endPress, {passive: false});
        btn.addEventListener('mouseleave', function() { clearTimeout(pressTimer); });
        btn.addEventListener('touchcancel', function() { clearTimeout(pressTimer); });

        async function wake() { try { if(navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch(e) {} }
        document.addEventListener('visibilitychange', wake);

        renderMain(); renderCoilers(); renderMil(); renderEvents(); wake();
    </script>
</body>
</html>
