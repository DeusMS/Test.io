<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Тандем-Пост</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <style>
        /* БЛОКИРОВКА ЗУМА ПРИ МИСКЛИКАХ */
        * { 
            box-sizing: border-box; margin: 0; padding: 0; 
            font-family: -apple-system, sans-serif; 
            touch-action: manipulation; /* Отрубает зум по двойному тапу */
        }
        
        body { 
            margin: 0; padding: 0; 
            background: #000; color: #fff; 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            display: flex; flex-direction: column; 
            user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none; /* Отрубает "резиновое" растягивание экрана */
        }
        
        #overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 100; display: none; opacity: 0; transition: opacity 0.3s; touch-action: none; }
        #side-menu { position: fixed; top: 0; left: -280px; bottom: 0; width: 280px; background: #111; z-index: 101; transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1); display: flex; flex-direction: column; padding-top: calc(env(safe-area-inset-top) + 20px); box-shadow: 5px 0 20px rgba(0,0,0,0.5); touch-action: none; }
        
        .menu-item { padding: 20px 25px; font-size: 24px; font-weight: bold; border-bottom: 1px solid #222; cursor: pointer; color: #aaa; }
        .menu-item.active { color: #fff; background: #222; border-left: 5px solid #007AFF; }
        .menu-item:active { background: #333; }

        #menu-btn { position: absolute; top: calc(env(safe-area-inset-top) + 15px); left: 15px; z-index: 99; background: rgba(255,255,255,0.15); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; backdrop-filter: blur(10px); }
        #menu-btn:active { background: rgba(255,255,255,0.3); transform: scale(0.9); }

        .tab-view { flex: 1; display: none; flex-direction: column; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); overflow: hidden; }
        .tab-view.active { display: flex; }

        /* ==================== ВКЛАДКА 1 ==================== */
        #top-zone { flex: 0 0 28%; display: flex; padding: 15px 20px 15px 70px; box-sizing: border-box; touch-action: none; }
        
        #roll-btn { 
            flex: 1; border-radius: 30px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            transition: 0.1s; box-shadow: 0 10px 30px -10px rgba(255,255,255,0.2);
        }
        #roll-btn:active { transform: scale(0.95); }
        
        .r1 { background: linear-gradient(135deg, #007AFF, #0050B3); }
        .r2 { background: linear-gradient(135deg, #BF5AF2, #782FCD); }
        .r3 { background: linear-gradient(135deg, #FF9F0A, #CC7300); }
        .r4 { background: linear-gradient(135deg, #FF453A, #B31009); box-shadow: 0 0 40px rgba(255, 69, 58, 0.6) !important; }
        
        #bot-zone { flex: 1; display: flex; flex-direction: column; padding: 0 20px 20px 20px; box-sizing: border-box; overflow: hidden; }
        
        #history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; min-height: 100px; -ms-overflow-style: none; scrollbar-width: none; overscroll-behavior: contain; }
        #history::-webkit-scrollbar { display: none; }
        
        .itm { background: #222; padding: 12px 16px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 22px; font-weight: bold; border: 1px solid #333; }
        .del-btn { background: #4a0000; color: #ff4444; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .del-btn:active { background: #ff4444; color: #fff; }
        
        #display { font-size: 44px; text-align: right; color: #fff; min-height: 54px; margin-bottom: 15px; font-weight: 300; }
        
        #keyboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; justify-items: center; align-self: center; width: 100%; max-width: 290px; flex-shrink: 0; }
        
        .key { 
            background: #333; color: #fff; border: none; 
            width: 75px; height: 75px; border-radius: 40px; font-size: 28px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
        }
        .key:active { background: #666; transform: scale(0.9); }
        
        .key-c { color: #FF453A; background: #2a0000; font-weight: bold; }
        .key-ok { background: #32D74B; color: #000; font-weight: bold; }
        .key-ok:active { background: #28a745; }

        /* ==================== ВКЛАДКА 2 ==================== */
        #tab-coilers { padding: 60px 20px 20px 20px; }
        .page-title { font-size: 34px; font-weight: bold; margin-bottom: 30px; margin-left: 10px; }

        .setting-row { background: #1C1C1E; border-radius: 20px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .setting-label { font-size: 24px; font-weight: 600; }

        .stepper { display: flex; align-items: center; background: #000; border-radius: 15px; padding: 5px; }
        .step-btn { background: #333; border: none; color: #fff; font-size: 30px; font-weight: bold; width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .step-btn:active { background: #555; transform: scale(0.9); }
        .step-val { width: 60px; text-align: center; font-size: 26px; font-weight: bold; color: #007AFF; }

        .toggle-switch { width: 70px; height: 40px; background: #333; border-radius: 20px; position: relative; cursor: pointer; transition: background 0.3s; }
        .toggle-switch .knob { width: 34px; height: 34px; background: #fff; border-radius: 50%; position: absolute; top: 3px; left: 3px; transition: left 0.3s, transform 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .toggle-switch.on { background: #32D74B; }
        .toggle-switch.on .knob { left: 33px; }
        .toggle-switch:active .knob { transform: scale(0.9); }
    </style>
</head>
<body>

    <div id="menu-btn" onclick="toggleMenu()">☰</div>
    <div id="overlay" onclick="toggleMenu()"></div>

    <div id="side-menu">
        <div class="menu-item active" id="nav-main" onclick="switchTab('main')">Главная (Счетчик)</div>
        <div class="menu-item" id="nav-coilers" onclick="switchTab('coilers')">Моталки (Свойства)</div>
    </div>

    <div id="tab-main" class="tab-view active">
        <div id="top-zone">
            <div id="roll-btn" class="r1">
                <div id="roll-num" style="font-size:100px; font-weight:bold; text-shadow: 0 4px 10px rgba(0,0,0,0.3);">1</div>
                <div id="roll-lbl" style="font-size:16px; font-weight:bold; color: rgba(255,255,255,0.8);">РУЛОН</div>
            </div>
        </div>
        <div id="bot-zone">
            <div id="history"></div>
            <div id="display">_</div>
            <div id="keyboard">
                <button class="key" onclick="k('1')">1</button>
                <button class="key" onclick="k('2')">2</button>
                <button class="key" onclick="k('3')">3</button>
                <button class="key" onclick="k('4')">4</button>
                <button class="key" onclick="k('5')">5</button>
                <button class="key" onclick="k('6')">6</button>
                <button class="key" onclick="k('7')">7</button>
                <button class="key" onclick="k('8')">8</button>
                <button class="key" onclick="k('9')">9</button>
                <button class="key key-c" onclick="k('C')">C</button>
                <button class="key" onclick="k('0')">0</button>
                <button class="key key-ok" onclick="k('OK')">OK</button>
            </div>
        </div>
    </div>

    <div id="tab-coilers" class="tab-view">
        <div class="page-title">Моталки</div>
        <div class="setting-row">
            <div class="setting-label">Высечки</div>
            <div class="stepper">
                <button class="step-btn" onclick="changeCut(-5)">-</button>
                <div class="step-val" id="cut-val">5</div>
                <button class="step-btn" onclick="changeCut(5)">+</button>
            </div>
        </div>
        <div class="setting-row" onclick="toggleThick()">
            <div class="setting-label">Утолщенный</div>
            <div class="toggle-switch" id="thick-toggle">
                <div class="knob"></div>
            </div>
        </div>
    </div>

    <script>
        var menuOpen = false;
        function toggleMenu() {
            var menu = document.getElementById('side-menu');
            var overlay = document.getElementById('overlay');
            if(menuOpen) {
                menu.style.left = "-280px";
                overlay.style.opacity = "0";
                setTimeout(function(){ overlay.style.display = "none"; }, 300);
            } else {
                overlay.style.display = "block";
                setTimeout(function(){ overlay.style.opacity = "1"; menu.style.left = "0"; }, 10);
            }
            menuOpen = !menuOpen;
        }

        function switchTab(tabName) {
            document.getElementById('tab-main').classList.remove('active');
            document.getElementById('tab-coilers').classList.remove('active');
            document.getElementById('nav-main').classList.remove('active');
            document.getElementById('nav-coilers').classList.remove('active');
            
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('nav-' + tabName).classList.add('active');
            toggleMenu(); 
        }

        var cRoll = 1;
        var hist = [];
        var inp = "";
        var vCut = 5; 
        var vThick = false; 
        var pressTimer;
        var isLongPress = false;

        function saveAll() {
            try { 
                localStorage.setItem('r_val', cRoll); 
                localStorage.setItem('h_val', JSON.stringify(hist)); 
                localStorage.setItem('cut_val', vCut);
                localStorage.setItem('thick_val', vThick);
            } catch(e) {}
        }

        function loadAll() {
            try { 
                cRoll = parseInt(localStorage.getItem('r_val')) || 1; 
                hist = JSON.parse(localStorage.getItem('h_val')) || []; 
                vCut = parseInt(localStorage.getItem('cut_val')) || 5;
                vThick = localStorage.getItem('thick_val') === 'true';
            } catch(e) { 
                cRoll = 1; hist = []; vCut = 5; vThick = false; localStorage.clear(); 
            }
        }
        loadAll(); 

        function renderCoilers() {
            document.getElementById('cut-val').innerText = vCut;
            var tgl = document.getElementById('thick-toggle');
            if(vThick) tgl.classList.add('on');
            else tgl.classList.remove('on');
        }

        window.changeCut = function(delta) {
            wake();
            var next = vCut + delta;
            if(next >= 5 && next <= 60) {
                vCut = next;
                saveAll();
                renderCoilers();
            }
        }

        window.toggleThick = function() {
            wake();
            vThick = !vThick;
            saveAll();
            renderCoilers();
        }

        function renderMain() {
            document.getElementById('roll-num').innerText = cRoll;
            document.getElementById('roll-lbl').innerText = cRoll === 4 ? "ИНСПЕКЦИЯ" : "РУЛОН";
            document.getElementById('roll-btn').className = "r" + cRoll;
            document.getElementById('display').innerText = inp === "" ? "_" : inp;

            var hDiv = document.getElementById('history');
            hDiv.innerHTML = "";
            for(var i = 0; i < hist.length; i++) {
                hDiv.innerHTML += "<div class='itm'><span>" + hist[i] + " м</span><button class='del-btn' onclick='del(" + i + ")'>✖</button></div>";
            }
            hDiv.scrollTop = hDiv.scrollHeight; 
        }

        window.del = function(index) {
            hist.splice(index, 1);
            saveAll();
            renderMain();
            wake();
        };

        window.k = function(val) {
            wake();
            if(val === 'C') {
                inp = "";
            } else if(val === 'OK') {
                if(inp !== "") {
                    hist.push(inp);
                    inp = "";
                    saveAll();
                }
            } else {
                if(inp.length < 5) inp += val;
            }
            renderMain();
        };

        var btn = document.getElementById('roll-btn');
        
        function startPress(e) {
            if(e.type === 'touchstart') e.preventDefault();
            wake();
            isLongPress = false;
            pressTimer = setTimeout(function() {
                isLongPress = true;
                cRoll = 1; 
                saveAll();
                renderMain();
            }, 1000);
        }

        function endPress(e) {
            if(e.type === 'touchend') e.preventDefault();
            clearTimeout(pressTimer);
            if(!isLongPress) {
                cRoll = cRoll < 4 ? cRoll + 1 : 1; 
                saveAll();
                renderMain();
            }
        }

        btn.addEventListener('mousedown', startPress);
        btn.addEventListener('touchstart', startPress, {passive: false});
        btn.addEventListener('mouseup', endPress);
        btn.addEventListener('touchend', endPress, {passive: false});
        btn.addEventListener('mouseleave', function() { clearTimeout(pressTimer); });
        btn.addEventListener('touchcancel', function() { clearTimeout(pressTimer); });

        async function wake() {
            try { if(navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch(e) {}
        }
        document.addEventListener('visibilitychange', wake);

        renderMain();
        renderCoilers();
        wake();
    </script>
</body>
</html>
